<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="tvsign: Apple TV apps, signed and renewed">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f8fb"/><stop offset="1" stop-color="#e8ebf3"/></linearGradient>
<radialGradient id="h1" cx=".18" cy=".1" r=".6"><stop offset="0" stop-color="#3b82f6" stop-opacity=".10"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<radialGradient id="h2" cx=".9" cy=".95" r=".5"><stop offset="0" stop-color="#22c55e" stop-opacity=".06"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfd6e6" stroke-width="1" stroke-opacity=".5"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1280" height="360" fill="url(#fade)"/></mask>
<style>
.t{font:700 72px -apple-system,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#111318;letter-spacing:-2px}
.s{font:500 22px -apple-system,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#5b6170}
.k{font:600 13px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#3b82f6;letter-spacing:2.5px}
.lab{font:600 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#5b6170;letter-spacing:1.5px}
.big{font:700 30px -apple-system,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#111318}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.ring{stroke-dasharray:327;stroke-dashoffset:327;animation:fill 8s cubic-bezier(.4,0,.2,1) infinite;transform:rotate(-90deg);transform-box:fill-box;transform-origin:50% 50%}
@keyframes fill{0%{stroke-dashoffset:327}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:327}}
.check{stroke-dasharray:60;stroke-dashoffset:60;animation:check 8s ease-out infinite}
@keyframes check{0%,55%{stroke-dashoffset:60}65%,85%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:60}}
.pkt{animation:pkt 2.4s ease-in-out infinite}
@keyframes pkt{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(118px);opacity:0}}
.led{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.flow,.ring,.check,.pkt,.led{animation:none;stroke-dashoffset:0}}</style>
</defs>
<rect width="1280" height="360" rx="28" fill="url(#bg)"/>
<rect width="1280" height="360" rx="28" fill="url(#grid)" mask="url(#m)"/>
<rect width="1280" height="360" rx="28" fill="url(#h1)"/>
<rect width="1280" height="360" rx="28" fill="url(#h2)"/>
<text x="72" y="118" class="k">FREE APPLE ID · WI-FI · AUTO-RENEW</text>
<text x="70" y="200" class="t">tvsign</text>
<text x="72" y="244" class="s">Your Apple TV apps, signed</text>
<text x="72" y="274" class="s">and renewed before day 7.</text>
<rect x="576" y="75" width="150" height="210" rx="18" fill="#ffffff" stroke="#dfe4ee"/><g fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"><rect x="611" y="123" width="80" height="34" rx="7"/><rect x="611" y="165" width="80" height="34" rx="7"/></g><circle class="led" cx="626" cy="140" r="4" fill="#22c55e"/><circle class="led" style="animation-delay:1.2s" cx="626" cy="182" r="4" fill="#22c55e"/><line x1="640" y1="140" x2="676" y2="140" stroke="#dfe4ee" stroke-width="4" stroke-linecap="round"/><line x1="640" y1="182" x2="676" y2="182" stroke="#dfe4ee" stroke-width="4" stroke-linecap="round"/><text x="592" y="247" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#22d3ee">PC · NAS · Pi</text><text x="592" y="269" class="lab">TVSIGN</text><line class="flow" x1="730" y1="165" x2="872" y2="165" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/><g class="pkt"><rect x="730" y="156" width="26" height="18" rx="5" fill="#3b82f6"/><text x="743" y="169" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9" font-weight="700" fill="#fff">IPA</text></g><text x="801" y="199" text-anchor="middle" class="lab">WI-FI</text><rect x="876" y="75" width="150" height="210" rx="18" fill="#ffffff" stroke="#dfe4ee"/><rect x="906" y="137" width="90" height="46" rx="12" fill="none" stroke="#22d3ee" stroke-width="2.5"/><rect x="924" y="191" width="54" height="6" rx="3" fill="#dfe4ee"/><text x="892" y="247" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#22d3ee">tvOS 26+</text><text x="892" y="269" class="lab">APPLE TV</text><rect x="1048" y="75" width="170" height="210" rx="18" fill="#ffffff" stroke="#dfe4ee"/><circle cx="1133" cy="161" r="52" fill="none" stroke="#dfe4ee" stroke-width="10"/><circle class="ring" cx="1133" cy="161" r="52" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/><text x="1133" y="163" text-anchor="middle" class="big">7d</text><path class="check" d="M1121 185 l8 8 l16 -16" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1064" y="269" class="lab">RENEWED</text>
</svg>