name: tests

# Unit tests and static checks. Called by docker.yml and windows.yml (their build jobs need it, so a
# release is never built from red tests); also runnable by hand. Linux covers the backend, Windows also runs
# the tests that need Windows (Job object for plumesign children, scheduled-task XML).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpx pyflakes pefile

      - name: Static check
        run: python -m pyflakes app tests windows/launcher windows/tools

      - name: Unit tests
        run: python -m unittest discover -s tests -v
