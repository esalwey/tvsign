name: windows

# Windows desktop edition: plumesign.exe (from vendor/Impactor) + PyInstaller app + Inno Setup
# per-user installer. The packaging itself lives in windows/build.ps1; this workflow only provides
# the toolchains and the plumesign.exe it bundles (TVSIGN_PLUMESIGN_EXE).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docker-compose*.yml', 'install.sh']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # tag builds publish the GitHub release

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  installer:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check vendored Impactor
        run: |
          if (-not (Test-Path vendor/Impactor/Cargo.lock)) {
            Write-Output "::error::vendor/Impactor is empty: run scripts/vendor-impactor.ps1 and commit it"; exit 1
          }
          Get-Content vendor/Impactor/VENDORED.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/Impactor -> target
          key: plumesign-windows

      - name: Build plumesign.exe
        working-directory: vendor/Impactor
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '0'
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: 'off'
          CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
        run: |
          cargo build --release --locked -p plumesign
          ./target/release/plumesign.exe --version
          "TVSIGN_PLUMESIGN_EXE=$PWD\target\release\plumesign.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            windows/requirements-windows.txt
            windows/requirements-lock.txt

      - name: Inno Setup
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          Set-Content -NoNewline -Encoding utf8NoBOM windows/version.txt $v
          "TVSIGN_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build installer (windows/build.ps1, version from windows/version.txt)
        run: ./windows/build.ps1

      # plumesign.exe imports VCRUNTIME140.dll, which the loader looks for beside plumesign.exe (not in
      # _internal\): the build copies it there, this proves it, and runs plumesign.exe from a copy of its folder
      # with a bare PATH so that only the DLLs shipped beside it can satisfy it.
      - name: Check the runtime DLLs shipped beside plumesign.exe
        run: |
          windows/.venv-build/Scripts/python.exe windows/tools/pe_deps.py check windows/dist/tvsign/plumesign.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test of the installer (install, plumesign, launch, /api/livez, quit, uninstall)
        run: ./windows/tools/smoke.ps1 -Setup (Get-ChildItem windows/dist/installer -Filter 'tvsign-setup-*.exe').FullName

      - name: Checksums
        run: |
          $files = @(Get-ChildItem windows/dist/installer -File -Filter *.exe)
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Tee-Object windows/dist/installer/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tvsign-windows-installer
          path: windows/dist/installer/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Docker (NAS / Raspberry Pi): ``ghcr.io/${{ github.repository_owner }}/tvsign:$($tag.Substring(1))``" +
                   "`n`nWindows: the installer is not code-signed yet. Windows SmartScreen asks for confirmation, and Smart App Control (Windows 11) may block it: see windows/README-windows.md. Check the download against SHA256SUMS.txt."
          $flags = @('--title', "tvsign $($tag.Substring(1))", '--generate-notes', '--notes', $notes)
          $flags += $(if ($tag.Contains('-')) { '--prerelease' } else { '--latest' })
          gh release create $tag @((Get-ChildItem windows/dist/installer -File).FullName) @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: plumesign-windows-x64
          path: vendor/Impactor/target/release/plumesign.exe
          retention-days: 30
