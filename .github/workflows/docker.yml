name: docker

# Multi-arch image ghcr.io/<owner>/tvsign, built on native runners (no QEMU: compiling
# idevice/ring/aws-lc under emulation takes hours). Each arch is pushed by digest, then a
# manifest list is assembled with the semver / latest / edge tags.
on:
  push:
    branches: [main]          # -> :edge
    tags: ['v*']              # -> :1.2.3, :1.2, :1 and :latest (not for -beta tags)
  pull_request:               # build + smoke test only, nothing pushed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tvsign
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check vendored Impactor
        run: |
          test -f vendor/Impactor/Cargo.lock || { echo "::error::vendor/Impactor is empty: run scripts/vendor-impactor.sh and commit it"; exit 1; }
          cat vendor/Impactor/VENDORED.txt

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # TVSIGN_VERSION is shown in the UI, /api/livez and the User-Agent: 1.0.0, not v1.0.0 / main / pr-3.
      - id: ver
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;;
            *) v="edge-${GITHUB_SHA::7}" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: TVSIGN_VERSION=${{ steps.ver.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=tvsign-${{ matrix.arch }}
          cache-to: type=gha,scope=tvsign-${{ matrix.arch }},mode=max

      - name: Load image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: TVSIGN_VERSION=${{ steps.ver.outputs.version }}
          load: true
          tags: tvsign:test
          cache-from: type=gha,scope=tvsign-${{ matrix.arch }}

      - name: Smoke test
        run: bash scripts/smoke-test.sh tvsign:test

      - name: Image size
        run: docker image ls tvsign:test

      - name: Export plumesign binary
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: plumesign
          outputs: type=local,dest=out
          cache-from: type=gha,scope=tvsign-${{ matrix.arch }}

      - name: Name plumesign binary
        run: |
          mv out/plumesign "out/plumesign-linux-${{ matrix.arch }}"
          (cd out && sha256sum "plumesign-linux-${{ matrix.arch }}" > "plumesign-linux-${{ matrix.arch }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: plumesign-linux-${{ matrix.arch }}
          path: out/*
          retention-days: 30

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=main
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      # What a stranger runs: no credentials. A private GHCR package (its visibility is separate from
      # the repository's and a push does not change it) fails here instead of on the first user.
      - name: Forget the registry credentials before pulling
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker logout ghcr.io

      - name: Smoke test the published tag (amd64 side of the manifest)
        run: |
          docker pull "$IMAGE:${{ steps.meta.outputs.version }}"
          bash scripts/smoke-test.sh "$IMAGE:${{ steps.meta.outputs.version }}"
